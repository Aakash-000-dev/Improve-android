
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract latest source ZIP
      - name: Extract Improve source
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 4 -type f -iname "*.zip" \
            ! -path "./.git/*" \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "No source ZIP found!"
            exit 1
          fi

          echo "Using source: $ZIP_FILE"

          mkdir -p _source
          unzip -q "$ZIP_FILE" -d _source

          PUBSPEC=$(find _source -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          cp -a "$PROJECT_DIR/." .

          echo "Flutter project extracted successfully."

      # 3. Install Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Install Android SDK 36
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      # 6. Generate complete Android project if missing
      - name: Prepare Android project
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || \
             [ ! -f android/app/src/main/AndroidManifest.xml ]; then

            echo "Generating Android project..."

            rm -rf android

            flutter create \
              --platforms=android \
              --org com.aakash \
              --project-name improve \
              .
          fi

      # 7. Configure app name
      - name: Configure application name
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="Improve"',
              text,
              count=1
          )

          path.write_text(text)
          print("Application name configured.")
          PY

          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Improve</string>
          </resources>
          EOF

      # 8. Configure Android compile SDK and desugaring
      - name: Configure Android Gradle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              text = path.read_text()

              text = re.sub(
                  r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                  'compileSdk = 36',
                  text
              )

              text = re.sub(
                  r'compileSdkVersion\s*\(?\s*flutter\.compileSdkVersion\s*\)?',
                  'compileSdk = 36',
                  text
              )

              if "isCoreLibraryDesugaringEnabled" not in text:
                  text = re.sub(
                      r'compileOptions\s*\{',
                      'compileOptions {\n'
                      '        isCoreLibraryDesugaringEnabled = true',
                      text,
                      count=1
                  )
              else:
                  text = re.sub(
                      r'isCoreLibraryDesugaringEnabled\s*=\s*false',
                      'isCoreLibraryDesugaringEnabled = true',
                      text
                  )

              if "coreLibraryDesugaring(" not in text:
                  text = re.sub(
                      r'dependencies\s*\{',
                      'dependencies {\n'
                      '    coreLibraryDesugaring('
                      '"com.android.tools:desugar_jdk_libs:2.1.4")',
                      text,
                      count=1
                  )

          elif groovy.exists():
              path = groovy
              text = path.read_text()

              text = re.sub(
                  r'compileSdkVersion\s+flutter\.compileSdkVersion',
                  'compileSdkVersion 36',
                  text
              )

              text = re.sub(
                  r'compileSdk\s+flutter\.compileSdkVersion',
                  'compileSdk 36',
                  text
              )

              if "coreLibraryDesugaringEnabled" not in text:
                  text = re.sub(
                      r'compileOptions\s*\{',
                      'compileOptions {\n'
                      '        coreLibraryDesugaringEnabled true',
                      text,
                      count=1
                  )

              if "coreLibraryDesugaring " not in text:
                  text = re.sub(
                      r'dependencies\s*\{',
                      "dependencies {\n"
                      "    coreLibraryDesugaring "
                      "'com.android.tools:desugar_jdk_libs:2.1.4'",
                      text,
                      count=1
                  )
          else:
              raise SystemExit("Android app Gradle file not found.")

          if "36" not in text:
              raise SystemExit("Could not configure compileSdk 36.")

          path.write_text(text)
          print(f"Configured {path} for Android SDK 36.")
          PY

      # 9. Install Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 10. Generate launcher icon
      - name: Generate app icon
        run: dart run flutter_launcher_icons

      # 11. Remove obsolete default test
      - name: Remove obsolete widget test
        run: rm -f test/widget_test.dart

      # 12. Analyze project
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      # 13. Build APK
      - name: Build APK
        run: flutter build apk --release

      # 14. Rename APK
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Improve.apk

      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Improve-Android
          path: Improve.apk
          if-no-files-found: error
          
