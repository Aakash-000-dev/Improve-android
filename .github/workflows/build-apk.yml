
name: Build Improve APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract the latest source ZIP
      - name: Find and extract ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 4 -type f -iname "*.zip" \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          echo "Using source: $ZIP_FILE"

          mkdir -p /tmp/improve-source
          unzip -o "$ZIP_FILE" -d /tmp/improve-source

      # 3. Move Flutter project to repository root
      - name: Move Flutter project to root
        shell: bash
        run: |
          PROJECT_DIR=$(find /tmp/improve-source \
            -name pubspec.yaml -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found in ZIP."
            exit 1
          fi

          echo "Flutter project: $PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .

      # 4. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 6. Generate Android project if incomplete
      - name: Generate Android folder if missing
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || \
             [ ! -f android/app/src/main/AndroidManifest.xml ]; then

            echo "Generating a fresh Android project..."

            rm -rf android

            flutter create \
              --platforms=android \
              --org com.aakash \
              --project-name improve .
          else
            echo "Existing Android project found."
          fi

      # 7. Configure installed app name
      - name: Configure app name
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          sed -i 's/android:label="[^"]*"/android:label="Improve"/' "$MANIFEST"

          echo "Application name set to Improve."

      # 8. Enable Android Core Library Desugaring
      - name: Enable Android core library desugaring
        shell: bash
        run: |
          KTS="android/app/build.gradle.kts"
          GROOVY="android/app/build.gradle"

          if [ -f "$KTS" ]; then
            FILE="$KTS"
            TYPE="kotlin"
          elif [ -f "$GROOVY" ]; then
            FILE="$GROOVY"
            TYPE="groovy"
          else
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

          echo "Configuring $FILE"

          if [ "$TYPE" = "kotlin" ]; then

            if ! grep -q 'compileOptions {' "$FILE"; then
              echo "ERROR: compileOptions block not found."
              exit 1
            fi

            if ! grep -q 'isCoreLibraryDesugaringEnabled' "$FILE"; then
              sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$FILE"
            fi

            if ! grep -q 'desugar_jdk_libs' "$FILE"; then
              printf '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$FILE"
            fi

          else

            if ! grep -q 'compileOptions {' "$FILE"; then
              echo "ERROR: compileOptions block not found."
              exit 1
            fi

            if ! grep -q 'coreLibraryDesugaringEnabled' "$FILE"; then
              sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' "$FILE"
            fi

            if ! grep -q 'desugar_jdk_libs' "$FILE"; then
              printf '\n\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n' >> "$FILE"
            fi

          fi

          echo "Core library desugaring configured."
          grep -n -E 'compileOptions|CoreLibraryDesugaring|desugar_jdk_libs' "$FILE"

      # 9. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 10. Generate launcher icon
      - name: Generate app icon
        run: |
          if [ ! -f assets/icon/app_icon.png ]; then
            echo "ERROR: App icon not found at assets/icon/app_icon.png"
            exit 1
          fi

          dart run flutter_launcher_icons

      # 11. Remove obsolete template widget test
      - name: Remove obsolete widget test
        shell: bash
        run: |
          if [ -f test/widget_test.dart ]; then
            rm test/widget_test.dart
            echo "Removed obsolete widget test."
          fi

      # 12. Analyze Flutter project
      - name: Analyze Flutter project
        run: flutter analyze
               
               --no-fatal-infos

      # 13. Build release APK
      - name: Build APK
        run: flutter build apk --release

      # 14. Rename APK
      - name: Rename APK
        run: |
          SOURCE="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$SOURCE" Improve.apk

      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Improve-Android
          path: Improve.apk
          if-no-files-found: error
          
