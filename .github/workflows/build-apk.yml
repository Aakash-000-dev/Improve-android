
name: Build Improve APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p /tmp/improve-source
          unzip -q "$ZIP_FILE" -d /tmp/improve-source

      - name: Move Flutter project to root
        run: |
          PROJECT_FILE=$(find /tmp/improve-source -name pubspec.yaml -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Flutter project found at: $PROJECT_DIR"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: Project files were not copied correctly."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android folder if missing
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
          rm -rf android
          flutter create --platforms=android --org com.aakash .
            
            fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Improve-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
