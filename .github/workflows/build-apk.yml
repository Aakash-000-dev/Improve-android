
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract latest source ZIP
      - name: Extract Improve source
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 4 -type f -iname "*.zip" \
            ! -path "./.git/*" \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "No source ZIP found!"
            exit 1
          fi

          echo "Using source: $ZIP_FILE"

          mkdir -p _source
          unzip -q "$ZIP_FILE" -d _source

          PUBSPEC=$(find _source -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          cp -a "$PROJECT_DIR/." .

          echo "Source extracted successfully."

      # 3. Install Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Verify preinstalled Android SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "Android SDK environment variable not found."
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "Android API 36 is not installed on this runner."
            echo "Available platforms:"
            ls "$ANDROID_HOME/platforms" || true
            exit 1
          fi

          echo "Android API 36 is available."

      # 6. Generate Android project if missing
      - name: Prepare Android project
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || \
             [ ! -f android/app/src/main/AndroidManifest.xml ]; then

            rm -rf android

            flutter create \
              --platforms=android \
              --org com.aakash \
              --project-name improve \
              .
          fi

      # 7. Configure app name
      - name: Configure application name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")

          text = path.read_text()

          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="Improve"',
              text,
              count=1
          )

          path.write_text(text)
          print("App name configured.")
          PY

      # 8. Configure Android Gradle
      
      - name: Configure Android Gradle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              text = path.read_text()

              text = re.sub(
                  r'compileSdk\s*=\s*.*',
                  'compileSdk = 36',
                  text,
                  count=1
              )

              text = re.sub(
                  r'isCoreLibraryDesugaringEnabled\s*=\s*false',
                  'isCoreLibraryDesugaringEnabled = true',
                  text
              )

              if "isCoreLibraryDesugaringEnabled" not in text:
                  text = re.sub(
                      r'compileOptions\s*\{',
                      'compileOptions {\n'
                      '        isCoreLibraryDesugaringEnabled = true',
                      text,
                      count=1
                  )

              # Remove any incorrect previous declaration
              text = re.sub(
                  r'(?m)^\s*coreLibraryDesugaring\([^)]*\)\s*\n?',
                  '',
                  text
              )

              # Add the required dependency
              match = re.search(r'(?m)^(\s*)dependencies\s*\{', text)

              if not match:
                  text += (
                      '\n\ndependencies {\n'
                      '    coreLibraryDesugaring('
                      '"com.android.tools:desugar_jdk_libs:2.1.4")\n'
                      '}\n'
                  )
              else:
                  indent = match.group(1) + '    '
                  position = match.end()
                  text = (
                      text[:position] + '\n' + indent +
                      'coreLibraryDesugaring('
                      '"com.android.tools:desugar_jdk_libs:2.1.4")' +
                      text[position:]
                  )

          elif groovy.exists():
              path = groovy
              text = path.read_text()

              text = re.sub(
                  r'compileSdkVersion\s+.*',
                  'compileSdkVersion 36',
                  text,
                  count=1
              )

              if "coreLibraryDesugaringEnabled" not in text:
                  text = re.sub(
                      r'compileOptions\s*\{',
                      'compileOptions {\n'
                      '        coreLibraryDesugaringEnabled true',
                      text,
                      count=1
                  )

              text = re.sub(
                  r'(?m)^\s*coreLibraryDesugaring\s+.*\n?',
                  '',
                  text
              )

              match = re.search(r'(?m)^(\s*)dependencies\s*\{', text)

              if not match:
                  text += (
                      "\n\ndependencies {\n"
                      "    coreLibraryDesugaring "
                      "'com.android.tools:desugar_jdk_libs:2.1.4'\n"
                      "}\n"
                  )
              else:
                  indent = match.group(1) + '    '
                  position = match.end()
                  text = (
                      text[:position] + '\n' + indent +
                      "coreLibraryDesugaring "
                      "'com.android.tools:desugar_jdk_libs:2.1.4'" +
                      text[position:]
                  )

          else:
              raise SystemExit("Android Gradle file not found.")

          path.write_text(text)

          print("compileSdk configured: 36")
          print("Core library desugaring enabled.")
          print("Desugaring dependency added.")
          PY
          
              

      # 9. Get Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 10. Generate launcher icon
      - name: Generate app icon
        run: dart run flutter_launcher_icons

      # 11. Remove default widget test
      - name: Remove obsolete widget test
        run: rm -f test/widget_test.dart

      # 12. Analyze Flutter project
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      # 13. Build APK
      - name: Build APK
        run: flutter build apk --release

      # 14. Rename APK
      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Improve.apk

      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Improve-Android
          path: Improve.apk
          if-no-files-found: error
          
